<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MinuteMeal" />
    <title>MinuteMeal</title>
    <!--
      Critical layout for the tab bar, inlined so it applies on the very
      first paint regardless of when the external stylesheet finishes
      loading (matters on a cold Render instance, where that request can be
      slow). Full styling still comes from styles.css; this is just enough
      to guarantee the bar is positioned and visible immediately.
    -->
    <style>
      nav.tabbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        background: #ffffff;
        min-height: 56px;
      }
      header.topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #faf6f0;
      }
    </style>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">MinuteMeal</div>
    </header>

    <main id="app"></main>

    <nav class="tabbar">
      <button data-route="home"><span class="tab-icon">🍽️</span>Home</button>
      <button data-route="halls"><span class="tab-icon">🏛️</span>Dining Halls</button>
      <button data-route="diary"><span class="tab-icon">📒</span>Diary</button>
      <button data-route="settings"><span class="tab-icon">⚙️</span>Settings</button>
    </nav>

    <div id="modal-root"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
